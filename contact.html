<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Mamatha Nanchari">
    <meta name="keywords" content="Portfolio, HTML5, CSS3, Contact">
    <meta name="author" content="Mamatha Nanchari">

    <title>Contact | Mamatha Nanchari</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Mamatha Nanchari</h1>

        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
            <button id="theme-toggle">🌙</button>
        </nav>
    </header>

    <main class="container">

        <section class="card">

            <h2>Contact Me</h2>

            <form>

                <label for="name">Name:</label><br>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>

                <br><br>

                <label for="email">Email:</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <br><br>

                <label for="message">Message:</label><br>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Enter your message"
                    required></textarea>

                <br><br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Mamatha Nanchari. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
