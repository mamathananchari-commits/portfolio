    <main>
        <section>
            <h2>Contact Me</h2>

            <form>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" aria-label="Enter your name"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" aria-label="Enter your email"><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" aria-label="Enter your message"></textarea><br><br>

                <button type="submit" aria-label="Send Message">Send Message</button>

            </form>
        </section>
