<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Projects of Mamatha Nanchari">
    <meta name="keywords" content="Portfolio, HTML5, CSS3, JavaScript, Projects">
    <meta name="author" content="Mamatha Nanchari">

    <title>Projects | Mamatha Nanchari</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <h1>Mamatha Nanchari</h1>

        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
            <button id="theme-toggle">🌙</button>
        </nav>

    </header>

    <main class="container">

        <!-- Existing Projects -->

        <section class="card">

            <h2>My To-Do List</h2>

            <article class="project-box">
                <h3>Learn JavaScript</h3>

                <p>
                   Complete JavaScript DOM practice.
                </p>
            </article>

            <article class="project-box">

                <h3>Build Portfolio</h3>

                <p>
                    Finish my portfolio website and upload it to GitHub.
                </p>

            </article>

        </section>

        <!-- ========================= -->
        <!-- Task 3 - Project Manager -->
        <!-- ========================= -->

        <section class="card" id="manage-projects">

            <h2>Manage Tasks</h2>

            <input
                type="text"
                id="projectName"
                placeholder="Enter Task Name">

            <textarea
                id="projectDesc"
                rows="4"
                placeholder="Enter Task Description"></textarea>

            <button id="addProjectBtn">
                Add Task
            </button>

            <div class="filters">

                <button id="allBtn">
                    All
                </button>

                <button id="activeBtn">
                    Active
                </button>

                <button id="completedBtn">
                    Completed
                </button>

            </div>

            <!-- Projects Added by JavaScript -->

            <div id="projectList">

            </div>

        </section>

    </main>

    <!-- Footer -->

    <footer>

        <p>&copy; 2026 Mamatha Nanchari. All Rights Reserved.</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
